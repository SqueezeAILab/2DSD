[project]
name = "twodsd"
version = "0.1.0"
description = "2DSD: two-dimensional speculative decoding for looped language models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm==0.26.0+2dsd",  # vllm-fork/: vLLM v0.26.0 with the 2DSD executor and last-loop KV sharing.
    "torch==2.11.0",
    "transformers==5.17.0",
    "accelerate>=1.15,<2",
    "datasets>=5,<6",
    "numpy>=2.2,<3",
    "safetensors>=0.4.5,<1",
    "sentencepiece>=0.2,<1",
    "speculators==0.9.0",  # DFlash decoder layers used by drafter training.
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "scipy>=1.14",  # chi-square checks in the sampling tests.
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
vllm = { path = "vllm-fork", editable = false }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
